from: markdown
to: pdf
pdf-engine: lualatex
output-file: thesis.pdf
resource-path:
  - ${.}
citeproc: true
csl: abnt.csl
number-sections: true
variables:
  documentclass: scrartcl
  fontsize: 12pt
  geometry:
    - top=30mm
    - bottom=20mm
    - left=30mm
    - right=20mm
include-in-header:
  - ${.}/preamble.tex
