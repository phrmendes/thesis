from: markdown
to: pdf
pdf-engine: lualatex
output-file: thesis.pdf
resource-path:
  - ${.}
citeproc: true
csl: abnt.csl
number-sections: true
variables:
  documentclass: scrartcl
  fontsize: 12pt
  geometry:
    - top=20mm
    - bottom=20mm
    - left=20mm
    - right=20mm
include-in-header:
  - ${.}/tex/packages.tex
  - ${.}/tex/settings.tex
include-before-body:
  - ${.}/tex/preface.tex
