[collection]
first_date = "2020-11-02"
last_date = "2023-10-30"

[clean]
# Weekly returns are winsorized between minus this value and this value.
return_cap = 1.0
# Share of the weeks after the first price week used for training.
training_share = 0.7
# The daily price must stay within these multiples of the training median.
min_price_multiple = 0.05
max_price_multiple = 20.0
# The asset filter uses the training weeks only.
min_mean_price = 1.0
min_observations = 350
max_stale_weeks = 4
# A run of identical daily prices longer than this is a stale price.
max_unchanged_days = 28

[eda]
item_min_weeks = 100

[charts]
# Window of the rolling standard deviation in the market chart.
volatility_weeks = 13
# Width of one return bucket in the histogram.
bin_width = 0.05
# Highest raw return that the histogram draws.
raw_ceiling = 5.0

[[charts.events]]
name = "CS2"
date = "2023-03-22"

[portfolio]
# 5% Steam plus 10% game fee, kept from the final sale.
net_sale_share = 0.85
min_roi = 0.05
min_sharpe = 0.10
min_sortino = 0.20

