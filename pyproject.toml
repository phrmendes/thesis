[project]
name = "thesis"
version = "1.0.0"
requires-python = ">=3.14"
description = "My economics bachelor's thesis (UFABC)"
dependencies = [
  "altair>=6.2.2",
  "duckdb>=1.2.0",
  "great_tables>=0.15",
  "httpx>=0.28.1",
  "mapie>=1.4.1",
  "numpy>=2.4.6",
  "orjson>=3.12.0",
  "polars>=1.42.1",
  "pydantic>=2",
  "scipy>=1.18.0",
  "sktime>=1.0.1",
  "statsforecast>=2.0.1",
  "tenacity>=9.1.4",
  "typer>=0.27.0",
  "uvloop>=0.22.1",
  "xgboost>=3.3.0",
]

[project.scripts]
thesis = "cli.main:app"

[tool.uv]
package = true

[tool.basedpyright]
typeCheckingMode = "recommended"
useLibraryCodeForTypes = true
reportAttributeAccessIssue = false
reportUnusedCallResult = false
reportUnknownMemberType = false
venvPath = ".devenv/state"
venv = "venv"

[tool.setuptools.packages.find]
include = ["cli*"]

[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4

[tool.sqlfluff.core]
dialect = "duckdb"

[tool.ruff.lint]
fixable = ["ALL"]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "C4",
  "E",
  "ERA",
  "F",
  "FBT",
  "FLY",
  "FURB",
  "I",
  "N",
  "NPY",
  "PERF",
  "PGH",
  "PL",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "T10",
  "T20",
  "TRY",
  "UP",
  "W",
]

[tool.ruff.lint.isort]
known-first-party = ["thesis"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = ["ty>=0.0.65"]
