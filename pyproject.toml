[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4

[tool.ruff.lint]
fixable = ["ALL"]
select = ["ALL"]
preview = true
ignore = [
  "COM812", # The formatter sets the trailing commas.
  "CPY001", # The project has no copyright notice.
  "D100",   # A module docstring is a file header.
]

[tool.ruff.format]
quote-style = "double"

[tool.pyrefly]
preset = "strict"
project-includes = ["notebooks"]
search-path = ["notebooks"]
python-version = "3.14"
ignore-errors-in-generated-code = false

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = [
  "B018", # A notebook cell ends with a bare expression that Jupyter displays.
]
"notebooks/**/*" = [
  "INP001",   # The notebooks are scripts, not a package.
  "PT009",    # The tests use the unittest assertions.
  "PT027",    # The tests use the unittest assertions.
  "D101",     # A test class name says what it covers.
  "D102",     # A test method name says what it checks.
  "D104",     # A test package needs no docstring.
  "PLR2004",  # The tests compare hand-computed values.
  "DTZ001",   # The test dates carry no timezone.
  "T201",     # The notebooks print the path of each written file.
  "RUF069",   # A weekly return of exactly zero is a real observation, not float noise.
]

[tool.jupytext]
formats = "ipynb,py:percent"
