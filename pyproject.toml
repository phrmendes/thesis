[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4

[tool.ruff.lint]
fixable = ["ALL"]
select = ["ALL"]
preview = true
ignore = [
  "COM812", # The formatter sets the trailing commas.
  "CPY001", # The project has no copyright notice.
  "D100",   # A module docstring is a file header.
]

[tool.ruff.format]
quote-style = "double"

[tool.marimo.runtime]
pythonpath = ["scripts/nb"]

[tool.pyrefly]
project-includes = ["scripts", "scripts/nb"]
search-path = ["scripts/nb"]
python-version = "3.14"
ignore-errors-in-generated-code = false

[tool.ruff.lint.per-file-ignores]
"scripts/nb/helpers/*.py" = [
  "T201", # The helpers print the path of each written file.
]


"scripts/nb/*.py" = [
  "ANN001",  # A cell takes the values of the other cells as parameters.
  "ANN201",  # A cell returns its own values as a tuple.
  "ANN202",  # The same generated return, for a private cell.
  "DOC201",  # The return annotation states the value.
  "INP001",  # The notebooks are scripts, not a package.
  "N803",    # The constants keep the names of the thesis tables.
  "N806",    # The same names inside a cell.
  "PLC0415", # A cell holds its own imports.
  "PLR0913", # A cell takes one parameter per value that it reads.
  "PLR0914", # A cell holds many locals to build the tables.
  "PLR0917", # The same parameters, passed by position.
  "T201",    # The notebooks print the path of each written file.
]
